name: Daily RDI Update

on:
  schedule:
    # Runs at 21:30 UTC (5:30 PM ET) Monday through Friday
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # We need write permissions to commit the updated CSVs back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Run Live Update Pipeline
        run: |
          python scripts/run_daily_update.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage the updated data files
          git add data/processed/*.csv
          git add data/features/*.csv
          git add data/cache/*.csv
          
          # Only commit if there are actually changes (e.g., market was open)
          if ! git diff --cached --quiet; then
            git commit -m "Automated Daily RDI Update: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new data to commit today."
          fi